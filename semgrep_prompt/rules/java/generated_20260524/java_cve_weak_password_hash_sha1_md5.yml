rules:
- id: java-weak-password-hash-message-digest
  message: Avoid using MessageDigest with MD5 or SHA-1 for password hashing; use a
    password-hashing KDF such as PBKDF2, bcrypt, scrypt, or Argon2 instead.
  severity: WARNING
  languages:
  - java
  pattern-either:
  - patterns:
    - pattern: MessageDigest.getInstance("MD5").digest($INPUT)
    - pattern-not: MessageDigest.getInstance("MD5").digest("...")
  - patterns:
    - pattern: MessageDigest.getInstance("SHA-1").digest($INPUT)
    - pattern-not: MessageDigest.getInstance("SHA-1").digest("...")
  - patterns:
    - pattern: MessageDigest.getInstance("SHA1").digest($INPUT)
    - pattern-not: MessageDigest.getInstance("SHA1").digest("...")
  - patterns:
    - pattern: MessageDigest.getInstance("SHA").digest($INPUT)
    - pattern-not: MessageDigest.getInstance("SHA").digest("...")
