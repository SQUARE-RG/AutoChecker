rules:
- id: spring-cors-wildcard-origins-with-credentials
  message: Wildcard CORS origins or origin patterns must not be combined with credentials
    enabled.
  severity: WARNING
  languages:
  - java
  pattern-either:
  - patterns:
    - pattern: '$C.addAllowedOrigin("*");

        ...

        $C.setAllowCredentials(true);

        '
  - patterns:
    - pattern: '$C.setAllowedOrigins(java.util.List.of("*"));

        ...

        $C.setAllowCredentials(true);

        '
  - patterns:
    - pattern: '$C.addAllowedOriginPattern("*");

        ...

        $C.setAllowCredentials(true);

        '
  - patterns:
    - pattern: '$C.setAllowedOriginPatterns(java.util.List.of("*"));

        ...

        $C.setAllowCredentials(true);

        '
  - pattern: $R.addMapping($PATH).allowedOrigins("*").allowCredentials(true)
  - pattern-regex: '@CrossOrigin\([^\)]*(origins|originPatterns)\s*=\s*\{?\s*"\*"\s*\}?[^\)]*allowCredentials\s*=\s*"true"[^\)]*\)'
  - patterns:
    - pattern: '$C.setAllowedOrigins(java.util.List.of("*"));

        ...

        return $C;

        '
    - pattern-not: '$C.setAllowedOrigins(java.util.List.of("https://" + ...));

        '
