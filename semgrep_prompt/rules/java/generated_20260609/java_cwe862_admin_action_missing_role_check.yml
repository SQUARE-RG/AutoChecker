    - pattern: "$RET $METHOD(HttpServletRequest $REQ, ...){\n  ...\n  $SINK($REQ.getParameter(...),\
        \ ...);\n  ...\n}\n"
    - pattern: "$RET $METHOD(HttpServletRequest $REQ, ...){\n  ...\n  grantAdmin(...);\n\
        \  ...\n}\n"
    - pattern-not: "$RET $METHOD(HttpServletRequest $REQ, ...){\n  ...\n  if (!$REQ.isUserInRole(...))\
        \ return;\n  ...\n}\n"
    - pattern-not: "$RET $METHOD(HttpServletRequest $REQ, ...){\n  ...\n  if (!Auth.isAdmin())\
        \ throw new SecurityException(...);\n  ...\n}\n"
    - pattern-not: "$RET $METHOD(HttpServletRequest $REQ, ...){\n  ...\n  if (!Auth.requireAdmin())\
        \ return;\n  ...\n}\n"
