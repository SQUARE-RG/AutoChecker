rules:
- id: java-cwe522-credential-disclosure
  message: Credential-like values should not be written to logs, HTTP responses, exception
    messages, or returned strings without redaction.
  severity: WARNING
  languages:
  - java
  pattern-either:
  - patterns:
    - pattern: $LOG.info($FMT, $X);
    - metavariable-regex:
        metavariable: $FMT
        regex: .*(password|token|secret|apiKey|privateKey|Authorization|refreshToken|clientSecret).*
    - metavariable-regex:
        metavariable: $X
        regex: .*(password|token|secret|apiKey|privateKey|Authorization|refreshToken|clientSecret).*
    - pattern-not: $LOG.info("<redacted>", ...);
    - pattern-not: $LOG.info("...redacted...");
    - pattern-not: $LOG.info("...redacted...", ...);
  - patterns:
    - pattern: $LOG.error($MSG + $X);
    - metavariable-regex:
        metavariable: $MSG
        regex: .*(password|token|secret|apiKey|privateKey|Authorization|refreshToken|clientSecret).*
    - metavariable-regex:
        metavariable: $X
        regex: .*(password|token|secret|apiKey|privateKey|Authorization|refreshToken|clientSecret).*
    - pattern-not: $LOG.error("apiKey present");
  - patterns:
    - pattern: $LOG.warning($X);
    - metavariable-regex:
        metavariable: $X
        regex: .*(password|token|secret|apiKey|privateKey|Authorization|refreshToken|clientSecret).*
    - pattern-not: $LOG.warning("refresh token rejected");
    - pattern-not: $LOG.warning("refresh token rejected", ...);
  - patterns:
    - pattern: $RES.getWriter().println($MSG + $X);
    - metavariable-regex:
        metavariable: $MSG
        regex: .*(password|token|secret|apiKey|privateKey|Authorization|refreshToken|clientSecret).*
    - metavariable-regex:
        metavariable: $X
        regex: .*(password|token|secret|apiKey|privateKey|Authorization|refreshToken|clientSecret).*
    - pattern-not: $RES.getWriter().println("token issued");
  - patterns:
    - pattern: $RES.getOutputStream().write($X.getBytes());
    - metavariable-regex:
        metavariable: $X
        regex: .*(password|token|secret|apiKey|privateKey|Authorization|refreshToken|clientSecret).*
    - pattern-not: $RES.getOutputStream().write("redacted".getBytes());
  - patterns:
    - pattern: new RuntimeException($MSG + $X)
    - metavariable-regex:
        metavariable: $MSG
        regex: .*(password|token|secret|apiKey|privateKey|Authorization|refreshToken|clientSecret).*
    - metavariable-regex:
        metavariable: $X
        regex: .*(password|token|secret|apiKey|privateKey|Authorization|refreshToken|clientSecret).*
    - pattern-not: new RuntimeException("secret unavailable");
    - pattern-not: new RuntimeException("secret unavailable", ...);
  - patterns:
    - pattern: return $PREFIX + $X;
    - metavariable-regex:
        metavariable: $PREFIX
        regex: .*(password|token|secret|apiKey|privateKey|Authorization|refreshToken|clientSecret).*
    - metavariable-regex:
        metavariable: $X
        regex: .*(password|token|secret|apiKey|privateKey|Authorization|refreshToken|clientSecret).*
    - pattern-not: return "ok";
    - pattern-not: return "...redacted...";
    - pattern-not: return "...redacted..." + ...;
