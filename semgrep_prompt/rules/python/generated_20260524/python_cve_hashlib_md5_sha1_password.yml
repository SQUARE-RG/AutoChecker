rules:
- id: python-insecure-password-hashlib-md5-sha1
  message: Avoid insecure password hashing with hashlib.md5() or hashlib.sha1(); use
    a slow password hashing function such as PBKDF2, bcrypt, argon2, or scrypt.
  severity: WARNING
  languages:
  - python
  pattern-either:
  - pattern: hashlib.md5(...).hexdigest()
  - pattern: hashlib.sha1(...).hexdigest()
  - pattern: hashlib.md5(...)
  - pattern: hashlib.sha1(...)
