rules:
- id: python-command-injection-shell-or-string-command
  message: 'Potential command injection: untrusted or runtime-controlled data reaches
    a shell command or string-based command execution.'
  severity: ERROR
  languages:
  - python
  mode: taint
  pattern-sources:
  - pattern-either:
    - pattern: request.args[$KEY]
    - pattern: request.form[$KEY]
    - pattern: os.environ[$KEY]
    - pattern: sys.argv[$IDX]
    - pattern: $PARAM
  pattern-propagators:
  - pattern: $DST = $SRC;
    from: $SRC
    to: $DST
  - pattern: $DST = $LEFT + $RIGHT;
    from: $LEFT
    to: $DST
  - pattern: $DST = $LEFT + $RIGHT;
    from: $RIGHT
    to: $DST
  - pattern: $DST = f"$...{$SRC}$..."
    from: $SRC
    to: $DST
  - pattern: $DST = f'$...{$SRC}$...'
    from: $SRC
    to: $DST
  pattern-sinks:
  - pattern-either:
    - patterns:
      - pattern: os.system($CMD)
      - pattern-not-inside: 'allowed = {...}

          os.system(allowed.get($USER, ...))'
    - pattern: commands.getoutput($CMD)
    - pattern: subprocess.run($CMD, shell=True);
    - pattern: subprocess.Popen($CMD, shell=True);
    - pattern: subprocess.call($CMD, shell=True);
    - pattern: subprocess.check_output($CMD, shell=True);
  options:
    taint_unify_mvars: true
