rules:
- id: c-libjwt-sensitive-claim-name
  message: Avoid adding credential-like JWT claims with jwt_add_grant; use non-sensitive
    claim names instead.
  severity: WARNING
  languages:
  - c
  pattern-either:
  - pattern: jwt_add_grant($JWT, "password", $VALUE);
  - pattern: jwt_add_grant($JWT, "secret", $VALUE);
  - pattern: jwt_add_grant($JWT, "token", $VALUE);
  - pattern: jwt_add_grant($JWT, "api_key", $VALUE);
  - pattern: jwt_add_grant($JWT, "access_token", $VALUE);
  - pattern: jwt_add_grant($JWT, "refresh_token", $VALUE);
  - pattern: jwt_add_grant($JWT, "passwd", $VALUE);
  - pattern: jwt_add_grant($JWT, "credential", $VALUE);
  - pattern: jwt_add_grant($JWT, "private_key", $VALUE);
  - pattern: jwt_add_grant($JWT, "authorization", $VALUE);
