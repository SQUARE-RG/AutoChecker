rules:
- id: c-libjwt-hardcoded-hmac-secret
  message: Avoid using hardcoded or static literal-derived secrets with jwt_set_alg()
    for HMAC algorithms; use runtime-provided secret material instead.
  severity: WARNING
  languages:
  - c
  pattern-either:
  - pattern: jwt_set_alg($JWT, JWT_ALG_HS256, (const unsigned char *)"...", ...);
  - patterns:
    - pattern: 'const unsigned char $KEY[] = "...";

        ...

        jwt_set_alg($JWT, JWT_ALG_HS256, (const unsigned char *)$KEY, ...);

        '
  - patterns:
    - pattern: 'static const unsigned char $KEY[] = "...";

        ...

        jwt_set_alg($JWT, JWT_ALG_HS256, (const unsigned char *)$KEY, ...);

        '
  - patterns:
    - pattern: 'const char $KEY[] = "...";

        ...

        jwt_set_alg($JWT, JWT_ALG_HS256, (const unsigned char *)$KEY, ...);

        '
