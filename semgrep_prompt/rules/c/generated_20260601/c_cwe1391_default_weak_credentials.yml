rules:
- id: c-weak-default-credentials
  message: Hardcoded default credentials are used to grant authentication.
  severity: WARNING
  languages:
  - c
  metadata:
    cwe: CWE-1391
  pattern-either:
  - pattern: return strcmp($U, "admin") == 0 && strcmp($P, "admin") == 0;
  - pattern: return strcmp($U, "root") == 0 && strcmp($P, "root") == 0;
  - pattern: return strcmp($U, "guest") == 0 && strcmp($P, "guest") == 0;
  - pattern: return strcmp($U, "") == 0 && strcmp($P, "") == 0;
  - pattern: return strcmp($U, "admin") == 0 || strcmp($P, "admin") == 0;
  - pattern: return strcmp($U, "root") == 0 || strcmp($P, "root") == 0;
  - pattern: return strcmp($U, "guest") == 0 || strcmp($P, "guest") == 0;
  - pattern: return strcmp($U, "") == 0 || strcmp($P, "") == 0;
  - pattern: return strcmp($U, "admin") == 0;
  - pattern: return strcmp($P, "admin") == 0;
  - pattern: return strcmp($U, "root") == 0;
  - pattern: return strcmp($P, "root") == 0;
  - pattern: return strcmp($U, "guest") == 0;
  - pattern: return strcmp($P, "guest") == 0;
  - pattern: return strcmp($U, "") == 0;
  - pattern: return strcmp($P, "") == 0;
