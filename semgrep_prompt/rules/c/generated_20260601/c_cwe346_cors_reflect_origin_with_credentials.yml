rules:
- id: c-cors-reflect-origin-with-credentials
  message: 'CORS response reflects request Origin into Access-Control-Allow-Origin
    and also sets Access-Control-Allow-Credentials: true without an allowlist guard.'
  severity: WARNING
  languages:
  - c
  pattern-either:
  - patterns:
    - pattern: 'fprintf($OUT, "Access-Control-Allow-Origin: %s\r\n", $ORIGIN);

        ...

        fprintf($OUT, "Access-Control-Allow-Credentials: true\r\n");

        '
    - pattern-not-inside: 'if (!allowed($ORIGIN)) return;

        ...

        fprintf($OUT, "Access-Control-Allow-Origin: %s\r\n", $ORIGIN);

        ...

        fprintf($OUT, "Access-Control-Allow-Credentials: true\r\n");

        '
    - pattern-not-inside: "if (allowed($ORIGIN)) {\n  ...\n  fprintf($OUT, \"Access-Control-Allow-Origin:\
        \ %s\\r\\n\", $ORIGIN);\n  ...\n  fprintf($OUT, \"Access-Control-Allow-Credentials:\
        \ true\\r\\n\");\n}\n"
  - patterns:
    - pattern: 'fprintf($OUT, "Access-Control-Allow-Origin: %s\r\n", $ORIGIN);

        fprintf($OUT, "Access-Control-Allow-Credentials: true\r\n");

        '
    - pattern-not-inside: 'if (!allowed($ORIGIN)) return;

        ...

        fprintf($OUT, "Access-Control-Allow-Origin: %s\r\n", $ORIGIN);

        ...

        fprintf($OUT, "Access-Control-Allow-Credentials: true\r\n");

        '
    - pattern-not-inside: "if (allowed($ORIGIN)) {\n  ...\n  fprintf($OUT, \"Access-Control-Allow-Origin:\
        \ %s\\r\\n\", $ORIGIN);\n  ...\n  fprintf($OUT, \"Access-Control-Allow-Credentials:\
        \ true\\r\\n\");\n}\n"
