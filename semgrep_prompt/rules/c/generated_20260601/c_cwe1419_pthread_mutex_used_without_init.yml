rules:
- id: c-pthread-mutex-used-without-init
  message: pthread_mutex_t used with pthread_mutex_lock/pthread_mutex_unlock without
    prior initialization
  severity: WARNING
  languages:
  - c
  pattern-either:
  - patterns:
    - pattern: 'pthread_mutex_t $M;

        ...

        pthread_mutex_lock(&$M);

        ...

        pthread_mutex_unlock(&$M);

        '
    - pattern-not: 'pthread_mutex_init(&$M, ...);

        ...

        pthread_mutex_lock(&$M);

        ...

        pthread_mutex_unlock(&$M);

        '
    - pattern-not: 'pthread_mutex_t $M;

        ...

        pthread_mutex_init(&$M, 0);

        ...

        pthread_mutex_lock(&$M);

        ...

        pthread_mutex_unlock(&$M);

        '
  - patterns:
    - pattern: 'pthread_mutex_t $M;

        ...

        pthread_mutex_unlock(&$M);

        ...

        pthread_mutex_lock(&$M);

        '
    - pattern-not: 'pthread_mutex_init(&$M, ...);

        ...

        pthread_mutex_unlock(&$M);

        ...

        pthread_mutex_lock(&$M);

        '
