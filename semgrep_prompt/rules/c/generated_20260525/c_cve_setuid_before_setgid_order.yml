rules:
- id: c.setuid-before-setgid
  message: Call setgid() before setuid(), and check return values for both privilege-dropping
    calls.
  severity: WARNING
  languages:
  - c
  patterns:
  - pattern: 'setuid(...);

      setgid(...);

      '
  - pattern-not: 'if (setgid(...) != 0) return;

      if (setuid(...) != 0) return;

      '
